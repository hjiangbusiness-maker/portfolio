<style>
  :root{ --paper:#ffffff; --ink:#1b1714; --muted:#6b6258; --rule:#1b1714; --accent:#ff5232; }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#1b1714; --ink:#f3f0ea; --muted:#8a7f73; --rule:#f3f0ea; } }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  ::selection{ background:var(--accent); color:#ffffff; }
  body{ background:var(--paper); color:var(--ink);
    font-family:'Archivo',-apple-system,sans-serif; -webkit-font-smoothing:antialiased;
    display:grid; place-items:center; padding:24px; }
  .card{ width:100%; max-width:340px; border:1px solid var(--rule); padding:26px 24px 22px; }
  .kicker{ font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.18em;
    text-transform:uppercase; color:var(--accent); margin:0 0 10px; }
  h1{ font-family:'Archivo',sans-serif; font-weight:900; letter-spacing:-0.03em;
    font-size:34px; line-height:0.95; margin:0 0 20px; }
  label{ display:block; font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--muted); margin:0 0 8px; }
  input{ width:100%; font-family:'Space Mono',monospace; font-size:15px; padding:11px 12px;
    border-radius:0; border:1px solid var(--rule); background:transparent; color:var(--ink); }
  input:focus{ outline:none; border-color:var(--accent); }
  button{ width:100%; margin-top:14px; font-family:'Space Mono',monospace; font-size:11px;
    letter-spacing:.08em; text-transform:uppercase; font-weight:700; padding:12px;
    border:1px solid var(--rule); border-radius:0; background:var(--ink); color:var(--paper); cursor:pointer; }
  button:hover{ background:var(--accent); border-color:var(--accent); color:#ffffff; }
  button:disabled{ opacity:.6; cursor:default; }
  .err{ font-family:'Space Mono',monospace; color:var(--accent); font-size:12px; margin-top:12px; min-height:16px; }
</style>
</head>

    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus>
    <button id="go" type="submit">Unlock</button>
    <div class="err" id="err"></div>
  </form>

const ITER = 250000;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const form = document.getElementById('gate');
const pwEl = document.getElementById('pw');
const errEl = document.getElementById('err');
const goEl = document.getElementById('go');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errEl.textContent = '';
  if (!(window.crypto && crypto.subtle)) {
    errEl.textContent = 'This page needs https:// to unlock. Check the address bar.';
    return;
  }
  goEl.disabled = true; goEl.textContent = 'Unlocking\u2026';
  try {
    const raw = b64(PAYLOAD);
    const salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pwEl.value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt, iterations:ITER, hash:'SHA-256' },
      km, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    const ptBuf = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, ct);
    const html = new TextDecoder().decode(ptBuf);
    // Load via a Blob URL (explicit UTF-8) inside a full-viewport iframe, so
    // scripts run and non-ASCII decodes correctly.
    const url = URL.createObjectURL(new Blob([html], { type:'text/html;charset=utf-8' }));
    const f = document.createElement('iframe');
    f.setAttribute('style', 'position:fixed;inset:0;width:100%;height:100%;border:0;');
    f.src = url;
    document.title = "RNDV · Portfolio";
    document.body.style.cssText = 'margin:0;padding:0;background:var(--paper);';
    document.body.replaceChildren(f);
  } catch (err) {
    goEl.disabled = false; goEl.textContent = 'Unlock';
    errEl.textContent = 'Wrong password.';
    pwEl.select();
  }
});
