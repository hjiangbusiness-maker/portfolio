<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RNDV · Portfolio</title>
<meta property="og:title" content="RNDV · Portfolio">
<meta property="og:description" content="Password protected.">
<meta property="og:url" content="https://portfolio.rndv.world">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@800&family=Courier+Prime&display=swap">
<style>
  :root{ --paper:#ffffff; --ink:#0a0a0a; --muted:#6a6f7e; --hairline:#d9dce4; --accent:#1d3fb5; --bad:#c0392b; }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#15110d; --ink:#f4ede0; --muted:#a39a87; --hairline:#3a342b; --accent:#e87b3a; } }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ background:var(--paper); color:var(--ink);
    font-family:'Courier Prime','Courier New',monospace;
    display:grid; place-items:center; padding:24px; }
  .card{ width:100%; max-width:340px; border:1px solid var(--hairline); border-radius:2px; padding:28px 24px; }
  .kicker{ font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin:0 0 6px; }
  h1{ font-family:'Schibsted Grotesk','Avenir Next',sans-serif; font-weight:800; letter-spacing:.02em;
    text-transform:uppercase; font-size:22px; margin:0 0 18px; }
  label{ display:block; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:0 0 7px; }
  input{ width:100%; font-family:inherit; font-size:15px; padding:10px 12px; border-radius:2px;
    border:1px solid var(--hairline); background:transparent; color:var(--ink); }
  input:focus{ outline:none; border-color:var(--accent); }
  button{ width:100%; margin-top:14px; font-family:inherit; font-size:13px; letter-spacing:.08em;
    text-transform:uppercase; font-weight:700; padding:10px 12px; border:1px solid var(--ink);
    border-radius:2px; background:transparent; color:var(--ink); cursor:pointer; }
  button:hover{ border-color:var(--accent); color:var(--accent); }
  button:disabled{ opacity:.6; cursor:default; }
  .err{ color:var(--bad); font-size:12.5px; margin-top:12px; min-height:16px; }
</style>
</head>

    <h1>Portfolio</h1>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus>
    <button id="go" type="submit">Unlock</button>
    <div class="err" id="err"></div>
  </form>

const ITER = 250000;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const form = document.getElementById('gate');
const pwEl = document.getElementById('pw');
const errEl = document.getElementById('err');
const goEl = document.getElementById('go');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errEl.textContent = '';
  goEl.disabled = true; goEl.textContent = 'Unlocking\u2026';
  try {
    const raw = b64(PAYLOAD);
    const salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pwEl.value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt, iterations:ITER, hash:'SHA-256' },
      km, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    const ptBuf = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, ct);
    const html = new TextDecoder().decode(ptBuf);
    // Load via a Blob URL (explicit UTF-8) inside a full-viewport iframe, so
    // scripts run and non-ASCII decodes correctly.
    const url = URL.createObjectURL(new Blob([html], { type:'text/html;charset=utf-8' }));
    const f = document.createElement('iframe');
    f.setAttribute('style', 'position:fixed;inset:0;width:100%;height:100%;border:0;');
    f.src = url;
    document.title = "RNDV · Portfolio";
    document.body.style.cssText = 'margin:0;padding:0;background:var(--paper);';
    document.body.replaceChildren(f);
  } catch (err) {
    goEl.disabled = false; goEl.textContent = 'Unlock';
    errEl.textContent = 'Wrong password.';
    pwEl.select();
  }
});
</script>
